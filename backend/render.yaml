services:
  - type: web
    name: flick-app
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python wsgi.py
    envVars:
      - key: SECRET_KEY
        value: flick-super-secret-key-2026
      - key: JWT_SECRET_KEY
        value: flick-jwt-secret-key-2026-abcdef
      - key: FLASK_ENV
        value: production
